<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Small icon (16/24/32/48px and toolbar). Every edge sits on a 2-unit grid, so keys stay crisp at 16px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6BD0"/>
      <stop offset="1" stop-color="#1A3F7A"/>
    </linearGradient>
  </defs>
  <rect id="body" x="0" y="4" width="32" height="24" rx="4" fill="url(#tile)"/>
  <g id="keys" fill="#FFFFFF">
    <rect x="2" y="8" width="4" height="4" rx="1"/><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="14" y="8" width="4" height="4" rx="1"/><rect x="20" y="8" width="4" height="4" rx="1"/><rect x="26" y="8" width="4" height="4" rx="1"/>
    <rect x="2" y="14" width="4" height="4" rx="1"/><rect x="8" y="14" width="4" height="4" rx="1"/><rect x="14" y="14" width="4" height="4" rx="1"/><rect x="20" y="14" width="4" height="4" rx="1"/><rect x="26" y="14" width="4" height="4" rx="1"/>
    <rect x="8" y="20" width="16" height="4" rx="1"/>
  </g>
</svg>
